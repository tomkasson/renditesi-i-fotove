# Renditësi i Fotove: pamja "Indigo i qetë" (ndjek modalitetin e çelët/të errët të Windows-it).
# Faqet lidhen me shiritin lart (st.navigation te app.py), jo me menunë anësore.

[client]
showSidebarNavigation = false
toolbarMode = "minimal"  # fsheh "Deploy" dhe menunë e zhvilluesit

[theme]
font = "Segoe UI, system-ui, sans-serif"
headingFontWeights = [700, 650, 650, 600, 600, 600]
headingFontSizes = ["2rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.9rem"]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"
borderColor = "#E2E8F0"
linkColor = "#4338CA"
greenColor = "#059669"
blueColor = "#4F46E5"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"
linkColor = "#A5B4FC"
greenColor = "#34D399"
blueColor = "#818CF8"
